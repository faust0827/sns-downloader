<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNS 미디어 다운로드 도구 — 인스타·틱톡·X·페이스북·블루스카이</title>
<meta name="description" content="인스타그램, 틱톡, X(트위터), 페이스북, 블루스카이에서 영상과 사진을 무료로 다운로드하세요.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 16px;
    padding: 40px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #333;
  }
  .subtitle {
    color: #666;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="url"] {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="url"]:focus {
    border-color: #667eea;
  }
  button {
    padding: 12px 24px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #5a6fd6; }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .platforms {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .platform {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    background: #f0f0f0;
    color: #555;
  }
  .result {
    margin-top: 24px;
    padding: 16px;
    border-radius: 8px;
    background: #f8f9fa;
    display: none;
  }
  .result.show { display: block; }
  .result img, .result video {
    max-width: 100%;
    border-radius: 8px;
    margin-top: 12px;
  }
  .download-btn {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 20px;
    background: #28a745;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
  }
  .error {
    color: #dc3545;
    margin-top: 12px;
    font-size: 14px;
  }
  .loading {
    text-align: center;
    padding: 20px;
    display: none;
  }
  .loading.show { display: block; }
  .spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid #667eea;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: #999;
  }
  .footer a { color: #667eea; text-decoration: none; }
</style>
</head>
<body>
  <div class="container">
    <h1>SNS 미디어 다운로드</h1>
    <p class="subtitle">인스타그램, 틱톡, X, 페이스북, 블루스카이에서 영상과 사진을 다운로드하세요</p>

    <div class="platforms">
      <span class="platform">Instagram</span>
      <span class="platform">TikTok</span>
      <span class="platform">X (Twitter)</span>
      <span class="platform">Facebook</span>
      <span class="platform">Bluesky</span>
    </div>

    <div class="input-group">
      <input type="url" id="urlInput" placeholder="SNS 게시물 URL을 붙여넣으세요" />
      <button id="downloadBtn" onclick="handleDownload()">다운로드</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>미디어를 추출하는 중...</p>
    </div>

    <div class="result" id="result"></div>

    <div class="footer">
      <p>공개 게시물만 지원됩니다. 저작권을 존중해 주세요.</p>
      <p><a href="https://issuedayissue.blogspot.com" target="_blank">IssueIssue 블로그</a></p>
    </div>
  </div>

  <script>
    async function handleDownload() {
      const url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      const loadingDiv = document.getElementById('loading');
      const btn = document.getElementById('downloadBtn');

      if (!url) {
        resultDiv.innerHTML = '<p class="error">URL을 입력해 주세요.</p>';
        resultDiv.classList.add('show');
        return;
      }

      btn.disabled = true;
      loadingDiv.classList.add('show');
      resultDiv.classList.remove('show');

      try {
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (data.error) {
          resultDiv.innerHTML = `<p class="error">${data.error}</p>`;
        } else if (data.mediaUrl) {
          const isVideo = data.type === 'video';
          resultDiv.innerHTML = `
            <p><strong>${data.platform}</strong>에서 미디어를 찾았습니다.</p>
            ${isVideo ? `<video src="${data.mediaUrl}" controls></video>` : `<img src="${data.mediaUrl}" alt="미디어" />`}
            <br>
            <a class="download-btn" href="${data.mediaUrl}" download target="_blank">다운로드</a>
          `;
        } else {
          resultDiv.innerHTML = '<p class="error">미디어를 찾을 수 없습니다.</p>';
        }
      } catch (e) {
        resultDiv.innerHTML = `<p class="error">오류가 발생했습니다: ${e.message}</p>`;
      } finally {
        loadingDiv.classList.remove('show');
        btn.disabled = false;
        resultDiv.classList.add('show');
      }
    }

    document.getElementById('urlInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleDownload();
    });
  </script>
</body>
</html>
